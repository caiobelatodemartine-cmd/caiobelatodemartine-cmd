<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Caio Demartine. Construo produto, do primeiro commit ao cliente pagante.">
  <defs>
    <radialGradient id="wash" cx="50%" cy="0%" r="120%">
      <stop offset="0" stop-color="#C6A15B" stop-opacity="0.11"/>
      <stop offset="0.6" stop-color="#C6A15B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fio" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C6A15B" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#C6A15B" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="quadro"><rect width="1280" height="300"/></clipPath>
  </defs>

  <g clip-path="url(#quadro)">
    <rect width="1280" height="300" fill="#101820"/>
    <rect width="1280" height="300" fill="url(#wash)"/>

    <g stroke="#E7E3D8" stroke-opacity="0.03" stroke-width="1">
      <path d="M0 75.5H1280M0 150.5H1280M0 225.5H1280"/>
      <path d="M160.5 0V300M320.5 0V300M480.5 0V300M640.5 0V300M800.5 0V300M960.5 0V300M1120.5 0V300"/>
    </g>

    <!--
      Os cem olhos de Argos, a direita: uma malha de pontos onde poucos estao
      "abertos" (ouro) e o resto observa em salvia. Sem animacao: o README e
      lido, nao assistido.
    -->
    <g transform="translate(880,150)">
      <g fill="#A8B8A4">
        <circle cx="0"   cy="-96" r="2.5" fill-opacity="0.22"/>
        <circle cx="56"  cy="-96" r="2.5" fill-opacity="0.16"/>
        <circle cx="112" cy="-96" r="2.5" fill-opacity="0.22"/>
        <circle cx="168" cy="-96" r="2.5" fill-opacity="0.14"/>
        <circle cx="224" cy="-96" r="2.5" fill-opacity="0.20"/>
        <circle cx="280" cy="-96" r="2.5" fill-opacity="0.12"/>
        <circle cx="336" cy="-96" r="2.5" fill-opacity="0.18"/>

        <circle cx="28"  cy="-48" r="2.5" fill-opacity="0.18"/>
        <circle cx="84"  cy="-48" r="2.5" fill-opacity="0.24"/>
        <circle cx="196" cy="-48" r="2.5" fill-opacity="0.16"/>
        <circle cx="252" cy="-48" r="2.5" fill-opacity="0.22"/>
        <circle cx="308" cy="-48" r="2.5" fill-opacity="0.14"/>
        <circle cx="364" cy="-48" r="2.5" fill-opacity="0.20"/>

        <circle cx="0"   cy="0"   r="2.5" fill-opacity="0.20"/>
        <circle cx="112" cy="0"   r="2.5" fill-opacity="0.16"/>
        <circle cx="168" cy="0"   r="2.5" fill-opacity="0.24"/>
        <circle cx="280" cy="0"   r="2.5" fill-opacity="0.18"/>
        <circle cx="336" cy="0"   r="2.5" fill-opacity="0.14"/>

        <circle cx="28"  cy="48"  r="2.5" fill-opacity="0.22"/>
        <circle cx="84"  cy="48"  r="2.5" fill-opacity="0.14"/>
        <circle cx="140" cy="48"  r="2.5" fill-opacity="0.20"/>
        <circle cx="252" cy="48"  r="2.5" fill-opacity="0.16"/>
        <circle cx="308" cy="48"  r="2.5" fill-opacity="0.22"/>
        <circle cx="364" cy="48"  r="2.5" fill-opacity="0.12"/>

        <circle cx="0"   cy="96"  r="2.5" fill-opacity="0.14"/>
        <circle cx="56"  cy="96"  r="2.5" fill-opacity="0.20"/>
        <circle cx="112" cy="96"  r="2.5" fill-opacity="0.16"/>
        <circle cx="224" cy="96"  r="2.5" fill-opacity="0.22"/>
        <circle cx="280" cy="96"  r="2.5" fill-opacity="0.14"/>
        <circle cx="336" cy="96"  r="2.5" fill-opacity="0.18"/>
      </g>
      <!-- os poucos que estao abertos -->
      <g>
        <circle cx="140" cy="-48" r="4"  fill="#C6A15B" fill-opacity="0.95"/>
        <circle cx="140" cy="-48" r="11" fill="none" stroke="#C6A15B" stroke-opacity="0.30" stroke-width="1.2"/>
        <circle cx="56"  cy="0"   r="3.5" fill="#C6A15B" fill-opacity="0.75"/>
        <circle cx="224" cy="0"   r="3"  fill="#C6A15B" fill-opacity="0.55"/>
        <circle cx="196" cy="48"  r="3"  fill="#C6A15B" fill-opacity="0.45"/>
        <circle cx="168" cy="96"  r="2.8" fill="#C6A15B" fill-opacity="0.35"/>
      </g>
    </g>

    <text x="96" y="126"
          font-family="'Segoe UI Semibold','Segoe UI',Inter,Helvetica,Arial,sans-serif"
          font-size="58" font-weight="600" letter-spacing="8" fill="#E7E3D8">CAIO DEMARTINE</text>

    <rect x="96" y="150" width="420" height="1" fill="url(#fio)"/>

    <text x="96" y="188"
          font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif"
          font-size="21" font-weight="400" fill="#C6A15B" letter-spacing="0.4">Construo produto, do primeiro commit ao cliente pagante</text>

    <text x="96" y="222"
          font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif"
          font-size="16" fill="#9A9384" letter-spacing="0.2">Desktop com Electron e TypeScript, backend em Postgres e Edge Functions,</text>
    <text x="96" y="246"
          font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif"
          font-size="16" fill="#9A9384" letter-spacing="0.2">e a parte que quase ninguem faz: LGPD, licenciamento e o instalador.</text>

    <path d="M0 299.5H1280" stroke="#C6A15B" stroke-opacity="0.28" stroke-width="1"/>
  </g>
</svg>
